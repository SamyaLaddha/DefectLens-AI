# DefectLens AI Training Configurations
dataset:
  name: "mvtec"
  categories: ["bottle", "cable", "screw"]
  category_runs:
    bottle: "run_2"
    cable: "run_3"
    screw: "run_2"
  category: "bottle"
  dataset_path: "./data/mvtec"
  image_size: 256
  batch_size: 32
  val_split: 0.10
  horizontal_flip: true
  num_workers: 0

model:
  backbone: "resnet18"

training:
  epochs: 100
  learning_rate: 0.0004
  seed: 42
  deterministic: true
  patience: 10
  device: "auto"
  run_name: "run_1"
  checkpoint_dir: "./checkpoints"
  log_dir: "./logs"
  require_all_categories: false

evaluation:
  threshold_method: "youden"
  pro_fpr_limit: 0.3
